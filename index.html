<!DOCTYPE html>
<html lang="en" data-theme="light" data-accent="emerald">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>Ethio-Majlis — Islamic App</title>
  <meta name="description" content="Ethio-Majlis: a premium Islamic Progressive Web App for the Ethiopian Muslim community. Quran with Amharic, Afaan Oromo & English translations, Dua, Prayer Times, Qibla, Tasbih, Quiz, Library and more." />
  <meta name="theme-color" content="#0B7A3E" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0c110e" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ethio-Majlis" />
  <meta property="og:title" content="Ethio-Majlis" />
  <meta property="og:description" content="በእውቀት፣ በኢባዳ፣ በአንድነት — Islamic app for the Ethiopian Muslim community." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/public/icons/icon-512.png" />

  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/public/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="/public/icons/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Amiri:wght@400;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/components.css" />

  <script type="importmap">
    {
      "imports": {
        "@vercel/analytics": "/node_modules/@vercel/analytics/dist/index.mjs"
      }
    }
  </script>
</head>
<body>
  <!-- Splash -->
  <div id="splash">
    <div class="logo-wrap">
      <img src="/public/icons/logo.png" alt="Ethio-Majlis logo" width="100" height="100" style="width:100%;height:100%;object-fit:contain" />
    </div>
    <h1>ETHIO-MAJLIS</h1>
    <p class="tagline">በእውቀት፣ በኢባዳ፣ በአንድነት</p>
    <div class="loader" role="status" aria-label="Loading"></div>
  </div>

  <!-- App shell -->
  <div id="app" aria-live="polite"></div>

  <div id="toast-wrap" aria-live="assertive"></div>
  <div id="modal-root"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
