<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Ethio-Majlis</title>
  <link rel="stylesheet" href="/css/theme.css" />
  <style>
    body { display: grid; place-items: center; min-height: 100dvh; text-align: center; padding: 24px; }
    .box { max-width: 360px; }
    img { width: 96px; margin: 0 auto 16px; border-radius: 22px; }
    h1 { color: var(--green); margin-bottom: 8px; }
    p { color: var(--text-2); margin-bottom: 20px; }
    a { display: inline-block; background: var(--green); color: #fff; padding: 12px 22px; border-radius: 999px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="box">
    <img src="/public/icons/logo.png" alt="Ethio-Majlis" />
    <h1>You're offline</h1>
    <p>Some features need an internet connection. Your saved Quran, Duas and bookmarks are still available.</p>
    <a href="/">Try Again</a>
  </div>
</body>
</html>
